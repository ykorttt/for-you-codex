<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오미쿠지 시뮬레이터</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#b8321e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Shippori+Mincho:wght@500;700&family=Yuji+Syuku&display=swap">
<style>
/* Layout: 폰 폭 한 줄 화면. 뽑기 화면은 신사(주홍색 바탕·시메나와·나무 통), 결과는 한 장의 오미쿠지 종이 */
:root {
  --shu: #b8321e;         /* 도리이 주홍, 바탕 */
  --shu-dark: #7e1d10;    /* 바탕 가장자리 */
  --shu-ink: #ad2a16;     /* 종이에 찍힌 주홍 인쇄 */
  --paper: #fbf8f1;       /* 오미쿠지 종이 */
  --sumi: #231c18;        /* 먹 */
  --sumi-soft: #6e6058;   /* 옅은 먹 */
  --kinari: #fff3df;      /* 주홍 위 글자 */
  --kinari-dim: rgba(255, 243, 223, .72);
  --kin: #efc062;         /* 금색, 채워진 게이지 */
  --wood-top: #efcb94;
  --wood-front: #dba768;
  --wood-left: #c08a4e;
  --wood-right: #a7713c;
  --wood-line: rgba(110, 64, 24, .18);
  --straw: #dcbc78;
  --straw-dark: #a9873f;
  --rule: rgba(35, 28, 24, .16);

  --f-brush: "Yuji Syuku", "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-ja: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", "Gowun Batang", serif;
  --f-ko: "Gowun Batang", "Shippori Mincho", "AppleMyungjo", "Nanum Myeongjo", serif;
  --f-ui: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", "Shippori Mincho", sans-serif;

  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

body {
  margin: 0;
  min-height: 100%;
  background: var(--shu);
  color: var(--kinari);
  font-family: var(--f-ui);
  font-size: 16px;
  line-height: 1.55;
  word-break: keep-all;
  overflow-wrap: anywhere;
  -webkit-tap-highlight-color: transparent;
}
[lang="ja"] { word-break: normal; }
.backdrop {
  position: fixed;
  inset: 0;
  z-index: -1;
  background: radial-gradient(130% 85% at 50% 32%, var(--shu) 0%, var(--shu) 42%, var(--shu-dark) 100%);
}
p, h1, h2, h3, dl, dd, ol { margin: 0; }
ruby rt { font-size: .5em; font-family: var(--f-ja); font-weight: 500; letter-spacing: 0; }

.app {
  max-width: 440px;
  min-height: 100%;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px 28px;
  display: flex;
  flex-direction: column;
}

/* ---------- 시메나와(금줄)와 시데 ---------- */
.rope {
  position: relative;
  height: 15px;
  margin: 0 -8px;
  border-radius: 8px;
  background:
    repeating-linear-gradient(-55deg, var(--straw) 0 7px, var(--straw-dark) 7px 9px, var(--straw) 9px 14px);
  box-shadow: 0 2px 0 rgba(0, 0, 0, .18);
}
.shide {
  position: absolute;
  top: 11px;
  width: 22px;
  height: 46px;
  transform-origin: 50% 0;
  animation: sway 4.5s ease-in-out infinite alternate;
}
.stage > .rope { align-self: stretch; }
.shide polygon { fill: var(--paper); }
.shide:nth-of-type(1) { left: 16%; }
.shide:nth-of-type(2) { left: calc(50% - 11px); animation-delay: -1.6s; }
.shide:nth-of-type(3) { right: 16%; animation-delay: -3s; }
@keyframes sway { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }

/* ---------- 뽑기 화면 ---------- */
.stage {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.title {
  margin-top: 42px;
  text-align: center;
}
.title h1 {
  font-family: var(--f-brush);
  font-weight: 400;
  font-size: clamp(2.4rem, 10vw, 3.2rem);
  line-height: 1.1;
  letter-spacing: .08em;
}
.subtitle {
  font-size: .9rem;
  color: var(--kinari-dim);
  letter-spacing: .04em;
}

.box-area {
  position: relative;
  flex: 1;
  display: grid;
  place-items: center;
  min-height: 0;
  width: 100%;
}
.box-btn {
  appearance: none;
  border: 0;
  padding: 0;
  background: none;
  cursor: pointer;
  border-radius: 16px;
  touch-action: manipulation;
}
.box-btn:focus-visible { outline: 2px dashed var(--kinari); outline-offset: 6px; }
.box-btn svg {
  display: block;
  height: clamp(190px, 36vh, 320px);
  width: auto;
  max-width: 100%;
  overflow: visible;
  filter: drop-shadow(0 10px 14px rgba(40, 6, 0, .35));
}
.box-flip { transition: transform .7s cubic-bezier(.5, -0.2, .3, 1.2); }
.box-flip.flipped { transform: rotate(180deg); }
.box-flip.instant, .box-flip.instant * { transition: none !important; }
.box-jolt { animation: idle 3.2s ease-in-out infinite alternate; }
.box-jolt.jolt { animation: jolt .32s ease-out; }
.box-flip.flipped .box-jolt { animation: none; }
@keyframes idle { from { transform: rotate(-1.5deg); } to { transform: rotate(1.5deg); } }
@keyframes jolt {
  0% { transform: rotate(0) translateY(0); }
  25% { transform: rotate(-13deg) translate(-6px, -10px); }
  55% { transform: rotate(10deg) translate(5px, -4px); }
  80% { transform: rotate(-4deg) translateY(0); }
  100% { transform: rotate(0); }
}
.stick-slide { transform: translateY(0); transition: transform .9s cubic-bezier(.2, .7, .2, 1); }
.stick-slide.out { transform: translateY(-96px); }

.pops { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.pop {
  position: absolute;
  font-family: var(--f-brush);
  font-size: 1.5rem;
  color: var(--kinari);
  animation: pop .75s ease-out forwards;
}
@keyframes pop {
  from { opacity: 0; transform: translateY(8px) scale(.8) rotate(var(--r, 0deg)); }
  25% { opacity: 1; }
  to { opacity: 0; transform: translateY(-34px) scale(1.1) rotate(var(--r, 0deg)); }
}

.control {
  width: 100%;
  min-height: 178px;
  display: grid;
  align-content: start;
}
.panel {
  display: grid;
  justify-items: center;
  gap: 8px;
  text-align: center;
}
.gauge { display: flex; gap: 10px; height: 36px; align-items: end; }
.gauge i {
  width: 9px;
  height: 30px;
  border-radius: 5px 5px 2px 2px;
  background: rgba(255, 243, 223, .22);
  transition: background .2s, transform .2s;
}
.gauge i.on { background: var(--kin); transform: translateY(-5px); }
.say { font-family: var(--f-ja); font-weight: 700; font-size: 1.35rem; letter-spacing: .04em; }
.say-ko { font-size: 1rem; margin-top: -6px; }
.hint { font-size: .82rem; color: var(--kinari-dim); max-width: 30ch; }

.btn {
  appearance: none;
  display: inline-grid;
  justify-items: center;
  gap: 1px;
  min-width: 12.5rem;
  padding: 10px 22px;
  border-radius: 999px;
  border: 1.5px solid var(--kinari);
  background: transparent;
  color: var(--kinari);
  font: inherit;
  font-size: 1rem;
  line-height: 1.3;
  cursor: pointer;
  touch-action: manipulation;
}
.btn small { font-size: .78rem; opacity: .85; }
.btn .ja { font-family: var(--f-ja); font-weight: 700; font-size: 1.08rem; }
.btn-primary { background: var(--paper); border-color: var(--paper); color: var(--sumi); box-shadow: 0 4px 0 var(--shu-dark); }
.btn-primary:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--shu-dark); }
.btn:focus-visible { outline: 2px dashed var(--kinari); outline-offset: 4px; }

.eyebrow { font-size: .8rem; letter-spacing: .12em; color: var(--kinari-dim); }
.num-ja { font-family: var(--f-brush); font-size: 2.6rem; line-height: 1.1; letter-spacing: .06em; }
.num-read { font-size: .95rem; margin-top: -4px; }
.num-read [lang="ja"] { font-family: var(--f-ja); }
.reveal { animation: rise .5s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

/* ---------- 오미쿠지 종이 ---------- */
.slip-screen { display: grid; gap: 18px; padding-top: 22px; }
.slip {
  position: relative;
  color: var(--sumi);
  background-color: var(--paper);
  background-image:
    radial-gradient(circle at 30% 40%, rgba(120, 88, 56, .07) 0 1px, transparent 1.5px),
    radial-gradient(circle at 70% 75%, rgba(120, 88, 56, .05) 0 1px, transparent 1.5px);
  background-size: 23px 31px, 37px 29px;
  padding: 12px;
  box-shadow: 0 14px 30px rgba(50, 8, 0, .35);
  transform-origin: 50% 0;
  animation: unfold .9s cubic-bezier(.25, .8, .25, 1);
}
@keyframes unfold {
  from { clip-path: inset(0 0 100% 0); transform: translateY(-10px); }
  to { clip-path: inset(0 0 0 0); transform: none; }
}
.slip-frame {
  border: 4px double var(--shu-ink);
  padding: 18px 16px 76px;
  display: grid;
  gap: 18px;
}
.slip-head { display: grid; justify-items: center; text-align: center; gap: 2px; }
.shrine { font-family: var(--f-ja); font-weight: 700; color: var(--shu-ink); font-size: .85rem; letter-spacing: .3em; }
.slip-no { font-family: var(--f-ja); font-size: 1rem; }
.slip-no small { font-family: var(--f-ui); color: var(--sumi-soft); font-size: .8rem; margin-left: 4px; }
.level {
  font-family: var(--f-brush);
  font-weight: 400;
  font-size: clamp(4.4rem, 24vw, 5.6rem);
  line-height: 1.05;
  letter-spacing: .12em;
  margin: 4px 0 2px;
  color: var(--shu-ink);
}
.slip.bad .level { color: var(--sumi); }
.level-read { font-size: 1rem; }
.level-read [lang="ja"] { font-family: var(--f-ja); font-weight: 700; }
.meaning { font-family: var(--f-ko); color: var(--sumi-soft); font-size: .86rem; margin-top: 6px; max-width: 30ch; }

.ladder-wrap { display: grid; gap: 6px; }
.ladder-label { font-size: .75rem; color: var(--sumi-soft); text-align: center; letter-spacing: .08em; }
.ladder {
  list-style: none;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
}
.ladder li {
  font-family: var(--f-ja);
  font-weight: 700;
  font-size: .8rem;
  text-align: center;
  padding: 5px 0;
  border: 1px solid var(--rule);
  color: var(--sumi-soft);
  white-space: nowrap;
}
.ladder li[aria-current="true"] { background: var(--shu-ink); border-color: var(--shu-ink); color: var(--paper); }
.slip.bad .ladder li[aria-current="true"] { background: var(--sumi); border-color: var(--sumi); }

.overall {
  display: grid;
  gap: 6px;
  text-align: center;
  padding: 14px 0;
  border-block: 1px solid var(--rule);
}
.overall .head { font-family: var(--f-ko); font-weight: 700; font-size: 1.24rem; line-height: 1.5; text-wrap: balance; }
.overall .text { font-family: var(--f-ko); font-size: .96rem; text-wrap: pretty; }

.items { display: grid; }
.item {
  display: grid;
  grid-template-columns: 4.4rem 1fr;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px dotted var(--rule);
}
.item:last-child { border-bottom: 0; }
.item dt { display: grid; align-content: start; justify-items: center; gap: 2px; padding-top: 4px; }
.item dt .ko {
  font-family: var(--f-ko);
  font-weight: 700;
  font-size: .98rem;
  line-height: 1.9;
  color: var(--shu-ink);
  border: 1px solid var(--shu-ink);
  padding: 0 6px;
  width: 100%;
  text-align: center;
}
.item dt .ja { font-family: var(--f-ja); font-size: .78rem; color: var(--sumi-soft); }
.item dd { min-width: 0; display: grid; gap: 3px; }
.item dd .head { font-family: var(--f-ko); font-weight: 700; font-size: 1.04rem; line-height: 1.5; text-wrap: pretty; }
.item dd .text { font-family: var(--f-ko); font-size: .93rem; line-height: 1.6; }

.custom {
  font-family: var(--f-ko);
  font-size: .86rem;
  color: var(--sumi-soft);
  background: rgba(173, 42, 22, .06);
  padding: 10px 12px;
  line-height: 1.65;
}
.custom b { color: var(--shu-ink); font-weight: 700; }
.seal {
  position: absolute;
  right: 26px;
  bottom: 24px;
  width: 46px;
  height: 46px;
  display: grid;
  place-items: center;
  border: 2px solid var(--shu-ink);
  border-radius: 6px;
  color: var(--shu-ink);
  font-family: var(--f-brush);
  font-size: .95rem;
  line-height: 1;
  writing-mode: vertical-rl;
  opacity: .78;
  transform: rotate(-8deg);
  pointer-events: none;
}

.actions { display: grid; justify-items: center; gap: 12px; }

/* ---------- 묶기(結ぶ) 화면 ---------- */
.tied { flex: 1; display: grid; align-content: center; justify-items: center; gap: 14px; text-align: center; padding-top: 30px; }
.tie-scene { position: relative; width: 100%; height: 130px; }
.tie-scene .rope { position: absolute; top: 20px; left: 0; right: 0; margin: 0; }
.knots { position: absolute; top: 26px; left: 0; right: 0; display: flex; justify-content: space-evenly; }
.knot {
  width: 13px;
  height: 46px;
  background: var(--paper);
  border-radius: 2px;
  box-shadow: 0 2px 4px rgba(0, 0, 0, .2);
  background-image: linear-gradient(transparent 0 12px, rgba(35, 28, 24, .22) 12px 15px, transparent 15px);
  transform-origin: 50% 0;
}
.knot:nth-child(odd) { transform: rotate(5deg); }
.knot:nth-child(even) { transform: rotate(-4deg); height: 40px; }
.knot.new { animation: tie .9s cubic-bezier(.3, 1.4, .5, 1) both; background-color: var(--paper); outline: 2px solid var(--kin); }
@keyframes tie { from { transform: translateY(70px) scale(1.8) rotate(0); opacity: 0; } to { transform: rotate(-3deg); opacity: 1; } }
.tied h2 { font-family: var(--f-brush); font-weight: 400; font-size: 2.6rem; letter-spacing: .08em; }
.tied .ko { font-family: var(--f-ko); font-size: 1rem; max-width: 26ch; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
@media (max-height: 600px) {
  .title { margin-top: 34px; }
  .title h1 { font-size: 2.2rem; }
}
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>

<main class="app" id="app">

  <!-- 뽑기 화면 -->
  <section class="stage" id="stage" aria-labelledby="title">
    <div class="rope" aria-hidden="true">
      <svg class="shide" viewBox="0 0 22 46"><polygon points="0,0 12,0 12,11 18,11 18,23 22,23 22,46 12,46 12,34 6,34 6,22 0,22"/></svg>
      <svg class="shide" viewBox="0 0 22 46"><polygon points="0,0 12,0 12,11 18,11 18,23 22,23 22,46 12,46 12,34 6,34 6,22 0,22"/></svg>
      <svg class="shide" viewBox="0 0 22 46"><polygon points="0,0 12,0 12,11 18,11 18,23 22,23 22,46 12,46 12,34 6,34 6,22 0,22"/></svg>
    </div>

    <header class="title">
      <h1 id="title" lang="ja">おみくじ</h1>
      <p class="subtitle">오미쿠지 시뮬레이터 · <span lang="ja">御神籤</span></p>
    </header>

    <div class="box-area">
      <button class="box-btn" id="box" type="button" aria-label="오미쿠지 통 흔들기">
        <div class="box-flip" id="box-flip">
          <div class="box-jolt" id="box-jolt">
            <svg viewBox="0 -84 160 380" aria-hidden="true">
              <defs>
                <clipPath id="above-hole"><rect x="0" y="-84" width="160" height="124"/></clipPath>
              </defs>
              <!-- 육각 나무 통 -->
              <polygon points="20,40 50,54 50,280 20,266" style="fill: var(--wood-left)"/>
              <polygon points="50,54 110,54 110,280 50,280" style="fill: var(--wood-front)"/>
              <polygon points="110,54 140,40 140,266 110,280" style="fill: var(--wood-right)"/>
              <g style="stroke: var(--wood-line)" stroke-width="1.2" fill="none">
                <path d="M62 60 C64 120 60 200 63 276"/>
                <path d="M96 60 C93 140 98 210 95 276"/>
                <path d="M33 50 C35 140 31 200 34 270"/>
                <path d="M126 50 C124 130 128 200 125 270"/>
              </g>
              <polygon points="20,40 50,26 110,26 140,40 110,54 50,54" style="fill: var(--wood-top)"/>
              <ellipse cx="80" cy="40" rx="8" ry="4" style="fill: var(--sumi)"/>
              <!-- 검은 띠 -->
              <g style="fill: var(--sumi)">
                <polygon points="20,52 50,66 50,75 20,61"/>
                <polygon points="50,66 110,66 110,75 50,75"/>
                <polygon points="110,66 140,52 140,61 110,75"/>
                <polygon points="20,244 50,258 50,267 20,253"/>
                <polygon points="50,258 110,258 110,267 50,267"/>
                <polygon points="110,258 140,244 140,253 110,267"/>
              </g>
              <!-- 라벨 -->
              <rect x="61" y="96" width="38" height="128" style="fill: var(--paper); stroke: var(--shu-ink)" stroke-width="2"/>
              <g lang="ja" text-anchor="middle" style="fill: var(--sumi); font-family: var(--f-brush)" font-size="24">
                <text x="80" y="126">お</text>
                <text x="80" y="155">み</text>
                <text x="80" y="184">く</text>
                <text x="80" y="213">じ</text>
              </g>
              <!-- 막대: 구멍 위로 나온 부분만 보인다 -->
              <g clip-path="url(#above-hole)">
                <g class="stick-slide" id="stick">
                  <rect x="76" y="40" width="8" height="130" rx="2" style="fill: var(--wood-top); stroke: var(--wood-left)" stroke-width="1"/>
                  <rect x="76" y="40" width="8" height="16" rx="2" style="fill: var(--shu-ink)"/>
                </g>
              </g>
            </svg>
          </div>
        </div>
      </button>
      <div class="pops" id="pops" aria-hidden="true"></div>
    </div>

    <div class="control">
      <div class="panel" id="shake-panel">
        <div class="gauge" id="gauge" role="img" aria-label="흔든 횟수"></div>
        <p class="say" lang="ja">スマホを振ってね！</p>
        <p class="say-ko">폰을 흔들어 주세요</p>
        <button class="btn btn-primary" id="enable-motion" type="button" hidden>
          <span>흔들기 켜기</span><small>동작 센서 사용을 허용해 주세요</small>
        </button>
        <p class="hint" id="shake-hint">폰을 꽉 잡고 흔들어요. 흔들기가 안 되면 통을 톡톡 눌러도 돼요.</p>
      </div>

      <div class="panel" id="number-panel" hidden>
        <p class="eyebrow">막대에 적힌 번호</p>
        <p class="num-ja" lang="ja" id="num-ja"></p>
        <p class="num-read"><span lang="ja" id="num-kana"></span> · <span id="num-ko"></span></p>
        <button class="btn btn-primary" id="open-slip" type="button">
          <span class="ja" lang="ja">おみくじを受け取る</span><small>운세 종이 받기</small>
        </button>
        <p class="hint">막대 번호와 같은 번호의 서랍에서 종이를 꺼내요.</p>
      </div>
    </div>
  </section>

  <!-- 결과: 오미쿠지 종이 -->
  <section class="slip-screen" id="slip-screen" hidden aria-label="운세 결과">
    <article class="slip" id="slip">
      <div class="slip-frame">
        <header class="slip-head">
          <p class="shrine" lang="ja" id="shrine"></p>
          <p class="slip-no"><span lang="ja" id="slip-no"></span><small id="slip-no-ko"></small></p>
          <h2 class="level" lang="ja" id="level"></h2>
          <p class="level-read"><span lang="ja" id="level-kana"></span> · <span id="level-ko"></span></p>
          <p class="meaning" id="meaning"></p>
        </header>

        <div class="ladder-wrap">

      { head: '마음도 쉬게 하라', text: '좋아하는 음악을 들으며 푹 쉬어요.' },
    ],
    money: [
      { head: '지갑을 꽁꽁 닫아라', text: '꼭 필요한 것만 사기!' },
      { head: '물건 분실 주의', text: '소지품에 이름을 붙여 둬요.' },
      { head: '지금은 지키는 데 집중', text: '큰돈은 쓰지 않기로 해요.' },
    ],
  },
];

const CUSTOM = {
  good: '<b>일본에서는</b> 좋은 운세를 지갑이나 수첩에 넣어 부적처럼 <span lang="ja">持{も}ち帰{かえ}る</span>(가지고 돌아가는) 경우가 많아요.',
  bad: '<b>일본에서는</b> 나쁜 운세가 나오면 신사의 나무나 줄에 <span lang="ja">結{むす}ぶ</span>(묶고) 돌아가요. 나쁜 운을 신사에 두고 간다는 뜻이에요.',
};

// =====================================================================
//  막대 번호 → 운세 배치표 (seed가 같으면 모든 폰에서 같은 번호 = 같은 종이)
// =====================================================================
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const STICKS = (() => {
  const list = [];
  LEVELS.forEach((lv, i) => { for (let k = 0; k < lv.sticks; k++) list.push(i); });
  const rnd = mulberry32(CONFIG.seed);
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
  const seen = LEVELS.map(() => 0);
  return list.map(level => {
    // 같은 운세끼리도 문구 조합이 겹치지 않도록 순번을 3진법 자릿수로 나눠 씀
    const k = seen[level]++;
    const d = [k % 3, Math.floor(k / 3) % 3, Math.floor(k / 9) % 3];
    d.push((d[0] + d[1] + d[2]) % 3);
    return { level, picks: d };
  });
})();

// =====================================================================
//  표기 도우미
// =====================================================================
const KANJI_DIGITS = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
const KANA_DIGITS = ['', 'いち', 'に', 'さん', 'よん', 'ご', 'ろく', 'なな', 'はち', 'きゅう'];

function kanjiNumber(n) {
  if (n === 100) return '百';
  const t = Math.floor(n / 10), o = n % 10;
  return (t > 1 ? KANJI_DIGITS[t] : '') + (t ? '十' : '') + KANJI_DIGITS[o];
}
function kanaNumber(n) {
  if (n === 100) return 'ひゃく';
  const t = Math.floor(n / 10), o = n % 10;
  return (t > 1 ? KANA_DIGITS[t] : '') + (t ? 'じゅう' : '') + KANA_DIGITS[o];
}
function esc(s) {
  return s.replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
}
function ruby(s) {
  return s.replace(/([㐀-鿿々]+)\{([^}]+)\}/g, '<ruby>$1<rt>$2</rt></ruby>');
}

// =====================================================================
//  화면 진행
// =====================================================================
const $ = id => document.getElementById(id);
const els = {
  stage: $('stage'), slipScreen: $('slip-screen'), tiedScreen: $('tied-screen'),
  box: $('box'), boxFlip: $('box-flip'), boxJolt: $('box-jolt'), stick: $('stick'), pops: $('pops'),
  gauge: $('gauge'), shakePanel: $('shake-panel'), numberPanel: $('number-panel'),
  enableMotion: $('enable-motion'), status: $('status'),
};
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let state = 'ready';
let shakes = 0;
let lastShakeAt = 0;
let current = 0;
let timers = [];

function later(fn, ms) { timers.push(setTimeout(fn, reduceMotion ? 0 : ms)); }
function buzz(pattern) { try { navigator.vibrate && navigator.vibrate(pattern); } catch (e) {} }
function say(text) { els.status.textContent = text; }

function buildGauge() {
  els.gauge.innerHTML = '<i></i>'.repeat(CONFIG.shakesNeeded);
  updateGauge();
}
function updateGauge() {
  [...els.gauge.children].forEach((el, i) => el.classList.toggle('on', i < shakes));
  els.gauge.setAttribute('aria-label', `흔든 횟수 ${shakes} / ${CONFIG.shakesNeeded}`);
}

function registerShake(minGap) {
  if (state !== 'ready') return;
  const now = performance.now();
  if (now - lastShakeAt < minGap) return;
  lastShakeAt = now;
  shakes++;
  els.boxJolt.classList.remove('jolt');
  void els.boxJolt.offsetWidth;
  els.boxJolt.classList.add('jolt');
  popKara();
  buzz(15);
  updateGauge();
  if (shakes >= CONFIG.shakesNeeded) draw();
}

function popKara() {
  if (reduceMotion) return;
  const p = document.createElement('span');
  p.className = 'pop';
  p.textContent = Math.random() < .5 ? 'カラ' : 'カラン';
  const left = Math.random() < .5 ? 8 + Math.random() * 18 : 64 + Math.random() * 18;
  p.style.left = left + '%';
  p.style.top = 18 + Math.random() * 50 + '%';
  p.style.setProperty('--r', (Math.random() * 30 - 15) + 'deg');
  els.pops.appendChild(p);
  setTimeout(() => p.remove(), 800);
}

function draw() {
  state = 'drawing';
  current = 1 + Math.floor(Math.random() * STICKS.length);
  say('막대가 나오고 있어요');
  later(() => els.boxFlip.classList.add('flipped'), 250);
  later(() => els.stick.classList.add('out'), 950);
  later(() => showNumber(current), 1900);
}

function showNumber(n) {
  state = 'number';
  $('num-ja').textContent = `第${kanjiNumber(n)}番`;
  $('num-kana').textContent = `だい${kanaNumber(n)}ばん`;
  $('num-ko').textContent = `${n}번`;
  els.shakePanel.hidden = true;
  els.numberPanel.hidden = false;
  els.numberPanel.classList.remove('reveal');
  void els.numberPanel.offsetWidth;
  els.numberPanel.classList.add('reveal');
  buzz([40, 60, 40]);
  say(`${n}번 막대가 나왔어요`);
  $('open-slip').focus({ preventScroll: true });
}

function renderSlip(n) {
  const stick = STICKS[n - 1];
  const lv = LEVELS[stick.level];
  $('shrine').textContent = CONFIG.shrineName;
  $('slip-no').textContent = `第${kanjiNumber(n)}番`;
  $('slip-no-ko').textContent = `${n}번`;
  $('level').textContent = lv.kanji;
  $('level-kana').textContent = lv.kana;
  $('level-ko').textContent = lv.ko;
  $('meaning').innerHTML = ruby(esc(lv.meaning));
  $('ladder').innerHTML = LEVELS.map((l, i) =>
    `<li${i === stick.level ? ' aria-current="true"' : ''}>${l.kanji}</li>`).join('');
  $('overall-head').textContent = `「${lv.overall.head}」`;
  $('overall-text').textContent = lv.overall.text;
  $('items').innerHTML = CATEGORIES.map((c, i) => {
    const list = lv[c.key];
    const line = list[stick.picks[i] % list.length];
    return `<div class="item">
      <dt><span class="ko">${esc(c.ko)}</span><span class="ja" lang="ja">${esc(c.ja)}</span></dt>
      <dd><p class="head">${esc(line.head)}</p><p class="text">${esc(line.text)}</p></dd>
    </div>`;
  }).join('');
  $('custom').innerHTML = ruby(lv.bad ? CUSTOM.bad : CUSTOM.good);
  $('slip').classList.toggle('bad', lv.bad);
  $('tie').hidden = !lv.bad;
  return lv;
}

function openSlip() {
  const lv = renderSlip(current);
  state = 'slip';
  els.stage.hidden = true;
  els.slipScreen.hidden = false;
  const slip = $('slip');
  slip.style.animation = 'none';
  void slip.offsetWidth;
  slip.style.animation = '';
  window.scrollTo(0, 0);
  say(`${current}번, ${lv.ko}입니다`);
}

function tie() {
  state = 'tied';
  els.slipScreen.hidden = true;
  els.tiedScreen.hidden = false;
  const k = $('new-knot');
  k.style.animation = 'none';
  void k.offsetWidth;
  k.style.animation = '';
  window.scrollTo(0, 0);
  $('again-2').focus({ preventScroll: true });
}

function reset() {
  timers.forEach(clearTimeout);
  timers = [];
  state = 'ready';
  shakes = 0;
  els.boxFlip.classList.add('instant');
  els.boxFlip.classList.remove('flipped');
  els.stick.classList.remove('out');
  void els.boxFlip.offsetWidth;
  els.boxFlip.classList.remove('instant');
  els.slipScreen.hidden = true;
  els.tiedScreen.hidden = true;
  els.stage.hidden = false;
  els.numberPanel.hidden = true;
  els.shakePanel.hidden = false;
  updateGauge();
  window.scrollTo(0, 0);
  say('다시 흔들어 주세요');
}

// ---------- 흔들기 감지 ----------
function onMotion(e) {
  const a = e.acceleration;
  const g = e.accelerationIncludingGravity;
  let mag;
  if (a && a.x != null) mag = Math.hypot(a.x, a.y, a.z);
  else if (g && g.x != null) mag = Math.abs(Math.hypot(g.x, g.y, g.z) - 9.81);
  else return;
  // 센서 값이 들어온다 = 이미 허용된 상태이므로 허용 버튼은 필요 없음
  els.enableMotion.hidden = true;
  if (mag > CONFIG.shakeThreshold) registerShake(220);
}

window.addEventListener('devicemotion', onMotion);

// 아이폰(iOS 13+)은 버튼을 눌러 동작 센서를 허용해야 값이 들어온다
const needsPermission = typeof DeviceMotionEvent !== 'undefined'
  && typeof DeviceMotionEvent.requestPermission === 'function';

if (needsPermission) {
  els.enableMotion.hidden = false;
  els.enableMotion.addEventListener('click', async () => {
    try {
      const result = await DeviceMotionEvent.requestPermission();
      if (result === 'granted') {
        els.enableMotion.hidden = true;
        say('이제 폰을 흔들어 주세요');
      } else {
        els.enableMotion.hidden = true;
        $('shake-hint').textContent = '동작 센서가 꺼져 있어요. 통을 톡톡 눌러서 흔들 수 있어요.';
      }
    } catch (err) {
      els.enableMotion.hidden = true;
      $('shake-hint').textContent = '이 화면에서는 흔들기를 쓸 수 없어요. 통을 톡톡 눌러서 흔들어 주세요.';
    }
  });
}

// ---------- 버튼 ----------
els.box.addEventListener('click', () => registerShake(120));
els.boxJolt.addEventListener('animationend', () => els.boxJolt.classList.remove('jolt'));
$('open-slip').addEventListener('click', openSlip);
$('tie').addEventListener('click', tie);
$('again-1').addEventListener('click', reset);
$('again-2').addEventListener('click', reset);

buildGauge();
</script>
</body>
</html>
